# CodeRabbit configuration — https://docs.coderabbit.ai/reference/yaml-template
# Governs both automatic PR reviews (CodeRabbit GitHub App) and the `coderabbit`
# CLI run locally. See AGENTS.md for repo conventions reviewers must honor.
language: en-US
early_access: false

reviews:
  # "chill" keeps PR noise low; switch to "assertive" for stricter passes.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    # Run on PRs targeting these branches.
    base_branches:
      - main

  # Skip generated/large/data artifacts that aren't worth reviewing.
  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!cloudflare-env.d.ts"        # generated by `wrangler types`
    - "!.open-next/**"
    - "!.next/**"
    - "!scripts/seeds/**"           # large seed fixtures
    - "!**/*.min.js"

  # Targeted guidance per area.
  path_instructions:
    - path: "src/**"
      instructions: >-
        This repo pins a custom Next.js build whose APIs and conventions may
        differ from upstream — see AGENTS.md. Do not flag App Router / Next.js
        usage as wrong based on generic Next.js knowledge; defer to the patterns
        already in the codebase. Flag floating promises, unhandled rejections,
        and any secret/token that could leak into client bundles or logs.
    - path: "src/lib/metrics.ts"
      instructions: >-
        Metric writes are fire-and-forget and must never throw into the request
        path. External analytics mirrors (GA4, PostHog) must each isolate their
        own failures. Flag added unbounded/awaited network calls on hot request
        paths.
    - path: "**/*.tsx"
      instructions: >-
        For any value interpolated into dangerouslySetInnerHTML, verify it is
        escaped against </script> breakout (JSON.stringify alone does not escape
        '<' or '/').

  tools:
    # Surfaces hardcoded secrets — relevant given ADMIN_TOKEN / API keys here.
    gitleaks:
      enabled: true

chat:
  auto_reply: true
